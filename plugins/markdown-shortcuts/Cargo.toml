[package]
name = "markdown-shortcuts"
description = "Markdown block shortcuts (# , > , - , 1. , [ ] , ```) as a Lexical plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
lexical-plugin = { path = "../../crates/lexical-plugin" }

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
