name: release

# Pushing a tag such as v0.1.0 builds the demo apps as a Flatpak bundle and attaches it to
# a GitHub release. Running it by hand with a `version` (e.g. v0.1.0) creates that tag on the
# selected ref and releases it; with no version it only produces the bundle as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create and release, e.g. v0.1.0 (leave empty for a bundle only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload the bundle
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo build packaging/flatpak/io.github.sevki.LexicalDemo.yml
          flatpak build-bundle repo lexical-demo.flatpak io.github.sevki.LexicalDemo
      - uses: actions/upload-artifact@v4
        with:
          name: lexical-demo.flatpak
          path: lexical-demo.flatpak
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
            --title "$TAG" lexical-demo.flatpak \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber lexical-demo.flatpak
