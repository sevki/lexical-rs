name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding `visual-change` re-evaluates the visual regression job
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: lexical-core (tests, incl. JetStream wire format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lexical-core
      - run: cargo test -p lexical-core --features jetstream

  sync:
    name: lexical-sync (Loro CRDT, concurrent-edit convergence + fuzz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lexical-sync
      - name: Deeper randomised sessions
        run: LEXICAL_FUZZ_SEEDS=200 cargo test --release -p lexical-sync --test fuzz

  plugin:
    name: lexical-plugin (WIT components, wasmtime host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/markdown-shortcuts
            plugins/command-fixture
      - run: cargo test -p lexical-plugin-host

  gtk:
    name: lexical-adw (GTK4 / libadwaita, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GNOME dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libadwaita-1-dev libgtk-4-dev xvfb dbus dbus-x11 \
            adwaita-icon-theme librsvg2-common
      # GTK needs a display and a session bus; see
      # https://pygobject.gnome.org/guide/testing.html for the same recipe.
      # The test binary has `harness = false` so GTK stays on the main thread.
      - name: Test under Xvfb + a private D-Bus session
        run: xvfb-run -a dbus-run-session -- cargo test -p lexical-adw
      - name: Build the demo
        run: cargo build -p lexical-adw --examples
      - name: Smoke-launch the demo for a few seconds
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            cargo run -q -p lexical-adw --example demo & pid=$!
            sleep 8
            kill -0 $pid   # still running: it did not crash on startup
            kill $pid'

  visual:
    name: Visual regression (base vs PR head)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # Same display stack for both renders; DejaVu keeps text metrics stable.
      GSK_RENDERER: cairo
      GDK_BACKEND: x11
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GNOME dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libadwaita-1-dev libgtk-4-dev xvfb dbus dbus-x11 \
            adwaita-icon-theme librsvg2-common fonts-dejavu-core
      - name: Render the PR head
        run: |
          xvfb-run -a dbus-run-session -- \
            cargo run --release -q -p lexical-adw --example visual -- render "$RUNNER_TEMP/visual/head"
      - name: Render the base branch
        id: base
        run: |
          git worktree add "$RUNNER_TEMP/base-src" "origin/${{ github.base_ref }}"
          if [ -f "$RUNNER_TEMP/base-src/crates/lexical-adw/examples/visual.rs" ]; then
            # Use the base's own tool so the baseline is exactly what the base would draw.
            (cd "$RUNNER_TEMP/base-src" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-base" \
              xvfb-run -a dbus-run-session -- \
              cargo run --release -q -p lexical-adw --example visual -- render "$RUNNER_TEMP/visual/base")
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare
        id: compare
        if: steps.base.outputs.has_baseline == 'true'
        # An intentional UI change is acknowledged with the `visual-change` label.
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: |
          set +e
          xvfb-run -a dbus-run-session -- \
            cargo run --release -q -p lexical-adw --example visual -- compare \
            "$RUNNER_TEMP/visual/base" "$RUNNER_TEMP/visual/head" "$RUNNER_TEMP/visual/diff" "$RUNNER_TEMP/report.md"
          status=$?
          {
            echo "### Visual regression"
            cat "$RUNNER_TEMP/report.md"
            [ "$status" -ne 0 ] && echo && echo "Differences found. Download the \`visual\` artifact to see base, head and diff images. If the change is intended, add the \`visual-change\` label."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Note when there is nothing to compare against
        if: steps.base.outputs.has_baseline == 'false'
        run: echo "### Visual regression" >> "$GITHUB_STEP_SUMMARY" && echo "The base branch has no visual tool yet, so there is nothing to compare. The head renders are attached as an artifact." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual
          path: ${{ runner.temp }}/visual
          if-no-files-found: ignore

  verus:
    name: Verus proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Verus (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo verus-lang/verus --pattern 'verus-*-x86-linux.zip' --dir "$RUNNER_TEMP/verus-dl"
          unzip -q "$RUNNER_TEMP"/verus-dl/*.zip -d "$HOME/verus"
          VERUS_BIN="$(find "$HOME/verus" -name verus -type f -perm -u+x | head -1)"
          echo "VERUS=$VERUS_BIN" >> "$GITHUB_ENV"
          # Verus pins its own rustc and refuses to run (even `--version`) without it, so
          # read the toolchain from its "rustup install <toolchain>" hint, falling back to
          # the version.json shipped next to the binary.
          TOOLCHAIN="$("$VERUS_BIN" --version 2>&1 | sed -n 's/.*rustup install \([^[:space:]]*\).*/\1/p' | head -1 | sed 's/\x1b\[[0-9;]*m//g')"
          if [ -z "$TOOLCHAIN" ]; then
            TOOLCHAIN="$(jq -r '.verus.toolchain // empty' "$(dirname "$VERUS_BIN")/version.json")"
          fi
          echo "Verus wants toolchain: $TOOLCHAIN"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
      - run: verus/verify.sh
