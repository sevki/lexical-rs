[package]
name = "lexical-adw"
description = "libadwaita / GTK4 views for the lexical-core rich text engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lexical-core = { path = "../lexical-core" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
# Only the demo uses it, behind the `plugins` feature, so CI jobs that do not need a Wasm
# runtime do not compile one.
lexical-wasmtime = { path = "../lexical-wasmtime", optional = true }

[dev-dependencies]
lexical-sync = { path = "../lexical-sync" }

[features]
plugins = ["dep:lexical-wasmtime"]

[[test]]
name = "gtk_smoke"
harness = false
