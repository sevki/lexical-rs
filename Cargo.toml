[workspace]
resolver = "2"
members = ["crates/lexical-core", "crates/lexical-adw", "crates/lexical-sync", "crates/lexical-plugin", "crates/lexical-plugin-host", "crates/lexical-plugin-wasmtime"]
# Guest plugins are built for wasm32-wasip2 on their own.
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sevki/lexical-rs"

[workspace.dependencies]
bitflags = "2"
serde_json = "1"
unicode-segmentation = "1"
